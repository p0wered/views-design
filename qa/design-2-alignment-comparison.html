<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка выравнивания второго дизайна</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #111827; color: #fff; font: 16px system-ui, sans-serif; }
      main { display: grid; gap: 20px; padding: 20px; }
      section { overflow: hidden; border: 1px solid #374151; border-radius: 16px; background: #1f2937; }
      h2 { margin: 0; padding: 14px 18px; font-size: 18px; }
      img { display: block; width: 100%; height: auto; background: #fff; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h2>До исправления — блоки второй карточки смещены вниз</h2>
        <img src="/qa/design-2-alignment-report.png" alt="Карточки до исправления">
      </section>
      <section>
        <h2>После исправления — разделители, суммы, условия и CTA выровнены</h2>
        <img src="/qa/design-2-alignment-fixed.png" alt="Карточки после исправления">
      </section>
    </main>
  </body>
</html>
